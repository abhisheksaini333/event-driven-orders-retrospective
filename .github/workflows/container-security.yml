name: Inspect container vulnerabilities
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application
            image: orders-retrospective:security
          - name: redis
            image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
          - name: dapr
            image: daprio/daprd:1.18.4@sha256:1e218523a15be5be5f36d64aa33a40cbde8fbe963ba6122d42d9c9de5b24a372
          - name: keycloak
            image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: matrix.name == 'application'
        run: docker build -t orders-retrospective:security .
      - name: Collect vulnerability report
        run: |
          mkdir -p .local/security
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.local/security:/reports" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --scanners vuln --format json --output /reports/${{ matrix.name }}.json '${{ matrix.image }}'
      - run: python3 scripts/check-vulnerabilities.py --trivy .local/security/${{ matrix.name }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-${{ matrix.name }}
          path: .local/security/*.json
