openapi: 3.0.3
info:
  title: Synthetic orders API
  version: 1.0.0
  description: Durable idempotent acceptance and asynchronous synthetic fulfillment.
servers:
  - url: http://localhost:4320
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Process running; does not establish dependency health}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: State store reachable; broker readiness is independent}
        '503': {description: State dependency unavailable}
  /orders:
    post:
      summary: Accept a synthetic order
      description: Requires orders_writer role. The key is scoped to verified JWT sub and is retained for the life of the ledger. Body limit is 4096 bytes.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{8,64}$', minLength: 8, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrder'}
      responses:
        '202':
          description: Order and outbox atomically recorded; fulfillment may still be pending
          headers:
            Location: {schema: {type: string}, description: Relative order read URL}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '200':
          description: Same owner, key and payload replayed; returns existing order/current status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid key or JSON payload}
        '401': {description: Missing or invalid JWT}
        '403': {description: Authenticated identity lacks orders_writer role}
        '409': {description: Same owner/key reused for different SKU or quantity}
        '413': {description: Request exceeds body size limit}
        '503': {description: State unavailable or CAS retries exhausted; retry same key and body}
  /orders/{id}:
    get:
      summary: Read an owned order
      description: Requires orders_reader or orders_writer role and matching JWT sub.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current order state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {description: Missing or invalid JWT}
        '403': {description: Required role missing}
        '404': {description: Missing order or different owner}
        '503': {description: State unavailable}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    CreateOrder:
      type: object
      required: [sku, quantity]
      properties:
        sku: {type: string, pattern: '^[A-Z0-9-]{1,32}$', example: SYNTHETIC-BOOK}
        quantity: {type: integer, minimum: 1, maximum: 1000, example: 2}
    Order:
      type: object
      required: [id, owner, sku, quantity, status, eventId]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        owner: {type: string, description: Verified JWT subject}
        sku: {type: string}
        quantity: {type: integer}
        status: {type: string, enum: [accepted, fulfilled]}
        eventId: {type: string, pattern: '^[a-f0-9]{32}$'}
