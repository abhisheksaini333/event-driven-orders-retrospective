{
  "openapi": "3.0.3",
  "info": {
    "title": "Synthetic orders API",
    "version": "1.0.0",
    "description": "Durable idempotent acceptance and asynchronous synthetic fulfillment."
  },
  "servers": [
    {
      "url": "http://localhost:4320"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/health/live": {
      "get": {
        "security": [],
        "responses": {
          "200": {
            "description": "Process running; does not establish dependency health"
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "security": [],
        "responses": {
          "200": {
            "description": "State store reachable; broker readiness is independent"
          },
          "503": {
            "description": "State dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/orders": {
      "post": {
        "summary": "Accept a synthetic order",
        "description": "Requires orders_writer role. The key is scoped to verified JWT sub and is retained for the life of the ledger. Body limit is 4096 bytes.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{8,64}(?![\\s\\S])",
              "minLength": 8,
              "maxLength": 64
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateOrder"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Order and outbox atomically recorded; fulfillment may still be pending",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                },
                "description": "Relative order read URL"
              },
              "Idempotency-Replayed": {
                "description": "Whether this response replays an existing request",
                "schema": {
                  "type": "string",
                  "enum": [
                    "true",
                    "false"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Order"
                }
              }
            }
          },
          "200": {
            "description": "Same owner, key and payload replayed; returns existing order/current status",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Order"
                }
              }
            },
            "headers": {
              "Idempotency-Replayed": {
                "description": "Whether this response replays an existing request",
                "schema": {
                  "type": "string",
                  "enum": [
                    "true",
                    "false"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid key or JSON payload",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid JWT"
          },
          "403": {
            "description": "Authenticated identity lacks orders_writer role"
          },
          "409": {
            "description": "Same owner/key reused for different SKU or quantity",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "413": {
            "description": "Request exceeds body size limit",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "503": {
            "description": "State unavailable or CAS retries exhausted; retry same key and body",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported media type",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Authenticated subject write limit exceeded; Retry-After gives the wait",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected failure; details remain private",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/orders/{id}": {
      "get": {
        "summary": "Read an owned order",
        "description": "Requires orders_reader or orders_writer role and matching JWT sub.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current order state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Order"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid JWT"
          },
          "403": {
            "description": "Required role missing"
          },
          "404": {
            "description": "Missing order or different owner"
          },
          "503": {
            "description": "State unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        }
      }
    },
    "/operations/dispatch": {
      "get": {
        "description": "Requires orders_operator role; returns aggregate status only.",
        "responses": {
          "200": {
            "description": "Observed dispatcher state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DispatchStatus"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid token"
          },
          "403": {
            "description": "Operator role missing"
          },
          "503": {
            "description": "State unavailable"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "CreateOrder": {
        "type": "object",
        "required": [
          "sku",
          "quantity"
        ],
        "properties": {
          "sku": {
            "type": "string",
            "pattern": "^[A-Z0-9-]{1,32}(?![\\s\\S])",
            "example": "SYNTHETIC-BOOK"
          },
          "quantity": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000,
            "example": 2
          }
        },
        "additionalProperties": false
      },
      "Order": {
        "type": "object",
        "required": [
          "id",
          "owner",
          "sku",
          "quantity",
          "status",
          "eventId",
          "acceptedAt",
          "fulfilledAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "owner": {
            "type": "string",
            "description": "Verified JWT subject"
          },
          "sku": {
            "type": "string"
          },
          "quantity": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "accepted",
              "fulfilled"
            ]
          },
          "eventId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "acceptedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "fulfilledAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        },
        "additionalProperties": false
      },
      "Problem": {
        "type": "object",
        "required": [
          "type",
          "title",
          "status",
          "code",
          "traceId"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "traceId": {
            "type": "string",
            "minLength": 1
          },
          "errors": {
            "type": "object",
            "additionalProperties": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          }
        }
      },
      "DispatchStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "enabled",
          "pendingEvents",
          "oldestPendingSeconds",
          "schemaVersion"
        ],
        "properties": {
          "enabled": {
            "type": "boolean"
          },
          "pendingEvents": {
            "type": "integer",
            "minimum": 0
          },
          "oldestPendingSeconds": {
            "type": "number",
            "nullable": true,
            "minimum": 0
          },
          "schemaVersion": {
            "type": "integer",
            "enum": [
              1
            ]
          }
        }
      }
    }
  }
}
